              dur='200ms'
              fill='freeze'
              from='3 0'
              to='1 0'
              keyTimes='0; 1'
              type='translate'/>
      <animateTransform
              attributeName='transform'
              begin='StateChange(disabled disabled-blocking, high)'
              dur='200ms'
              fill='freeze'
              from='3 0'
              to='0 0'
              keyTimes='0; 1'
              type='translate'/>
      <path
