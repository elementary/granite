<svg
        xmlns='http://www.w3.org/2000/svg'
        xmlns:svg='http://www.w3.org/2000/svg'
        xmlns:gpa='https://www.gtk.org/grappa'
        gpa:version='1'
        gpa:state-names='low normal high disabled disabled-blocking'
        gpa:state='2'
        id='svg1'
        width='16'
        height='16'
        xml:space='preserve'>
  <g
          id='mask-group'>
    <g
            id='animation-group'>
      <animate
              attributeName='opacity'
              begin='StateChange(low normal high disabled-blocking, disabled)'
              dur='200ms'
              fill='freeze'
              to='0.5'
              keyTimes='0; 1'/>
      <animate
              attributeName='opacity'
              begin='StateChange(disabled, low normal high disabled-blocking)'
              dur='200ms'
              fill='freeze'
              to='1'
              keyTimes='0; 1'/>
      <animateTransform
              attributeName='transform'
              begin='StateChange(low, normal)'
              dur='200ms'
              fill='freeze'
              from='2 0'
              to='1 0'
              keyTimes='0; 1'
              type='translate'/>
      <animateTransform
              attributeName='transform'
              begin='StateChange(low, high)'
              dur='200ms'
              fill='freeze'
              from='2 0'
              to='0 0'
              keyTimes='0; 1'
              type='translate'/>
      <animateTransform
