              stroke-width='1'
              stroke-linecap='butt'
              stroke-linejoin='miter'
              stroke-miterlimit='4'
              d='M 6.12734 4.08336 L 3.61211 6.33332 A 0.654449 0.654449 159.093 0 1 3.17578 6.5 L 2 6.5 A 0.5 0.5 135 0 0 1.5 7 L 1.5 9 A 0.5 0.5 45 0 0 2 9.5 L 3.17578 9.5 A 0.654449 0.654449 20.9069 0 1 3.61211 9.66668 L 6.12734 11.9166 A 0.223589 0.223589 155.907 0 0 6.5 11.75 L 6.5 4.25 A 0.223589 0.223589 24.0931 0 0 6.12734 4.08336 Z'
              gpa:stroke-minwidth='25%'
              gpa:stroke-maxwidth='150%'>
        <animate
                attributeName='fill'
                begin='StateChange(low normal high disabled, disabled-blocking)'
                dur='200ms'
                fill='freeze'
                to='url(#gpa:warning) rgb(249,196,64)'
                keyTimes='0; 1'/>
        <animate
                attributeName='fill'
                begin='StateChange(disabled-blocking, low normal high disabled)'
                dur='200ms'
                fill='freeze'
                to='url(#gpa:foreground) rgb(0,0,0)'
                keyTimes='0; 1'/>
        <animate
