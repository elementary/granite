                begin='StateChange(low normal high disabled, disabled-blocking)'
                dur='200ms'
                fill='freeze'
                to='url(#gpa:warning) rgb(249,196,64)'
                keyTimes='0; 1'/>
        <animate
                attributeName='stroke'
                begin='StateChange(disabled-blocking, low normal high disabled)'
                dur='200ms'
                fill='freeze'
                to='url(#gpa:foreground) rgb(0,0,0)'
                keyTimes='0; 1'/>
      </path>
      <path
              id='wave-low'
              class=''
              style='fill:none;'
              stroke='url(#gpa:foreground) rgb(0,0,0)'
              stroke-opacity='1'
              stroke-width='1'
              stroke-linecap='round'
              stroke-linejoin='miter'
              stroke-miterlimit='4'
              d='M 8.89711 5.75 A 4.5 4.5 0 0 1 8.89711 10.25'
              gpa:stroke-minwidth='25%'
              gpa:stroke-maxwidth='150%'
              gpa:states='low normal high'
              gpa:transition-type='fade'
              gpa:transition-easing='ease-in-out'
              gpa:transition-duration='200ms'>
      </path>
      <path
              id='wave-medium'
              class=''
              style='fill:none;'
              stroke='url(#gpa:foreground) rgb(0,0,0)'
              stroke-opacity='1'
              stroke-width='1'
              stroke-linecap='round'
              stroke-linejoin='miter'
              stroke-miterlimit='4'
              d='M 11.0622 4.5 A 7 7 0 0 1 11.0622 11.5'
              gpa:stroke-minwidth='25%'
              gpa:stroke-maxwidth='150%'
              gpa:states='normal high'
              gpa:transition-type='fade'
              gpa:transition-easing='ease-in-out'
              gpa:transition-duration='200ms'>
      </path>
      <path
              id='wave-high'
              class=''
              style='fill:none;'
              stroke='url(#gpa:foreground) rgb(0,0,0)'
              stroke-opacity='1'
              stroke-width='1'
              stroke-linecap='round'
              stroke-linejoin='miter'
              stroke-miterlimit='4'
              d='M 13.2272 3.25 A 9.5 9.5 0 0 1 13.2272 12.75'
              gpa:stroke-minwidth='25%'
              gpa:stroke-maxwidth='150%'
              gpa:states='high'
              gpa:transition-type='fade'
              gpa:transition-easing='ease-in-out'
              gpa:transition-duration='200ms'>
      </path>
