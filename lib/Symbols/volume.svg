              fill='freeze'
              from='1 0'
              to='0 0'
              keyTimes='0; 1'
              type='translate'/>
      <animateTransform
              attributeName='transform'
              begin='StateChange(normal, disabled disabled-blocking)'
              dur='200ms'
              fill='freeze'
              from='1 0'
              to='3 0'
              keyTimes='0; 1'
              type='translate'/>
      <animateTransform
              attributeName='transform'
              begin='StateChange(high, low)'
              dur='200ms'
              fill='freeze'
              from='0 0'
              to='2 0'
              keyTimes='0; 1'
              type='translate'/>
      <animateTransform
              attributeName='transform'
              begin='StateChange(high, normal)'
              dur='200ms'
              fill='freeze'
              from='0 0'
              to='1 0'
              keyTimes='0; 1'
              type='translate'/>
      <animateTransform
