  <mask
          id='disabled-mask'
          opacity='1'>
    <rect
            id='rect2'
            class=''
            fill='rgb(255,255,255)'
            x='0'
            y='0'
            width='100%'
            height='100%'>
    </rect>
    <line
            id='slash-clip'
            class=''
            visibility='hidden'
            stroke='rgb(0,0,0)'
            stroke-opacity='1'
            stroke-width='2'
            stroke-linecap='round'
            stroke-linejoin='round'
            stroke-miterlimit='4'
            x1='2.5'
            y1='3.5'
            x2='13.5'
            y2='14.5'
            gpa:stroke-minwidth='50%'
            gpa:stroke-maxwidth='150%'
            gpa:states='disabled disabled-blocking'
            gpa:transition-type='animate'
            gpa:transition-easing='ease-in-out'
            gpa:transition-duration='200ms'>
    </line>
  </mask>
</svg>
