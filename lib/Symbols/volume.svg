              fill='freeze'
              from='2 0'
              to='3 0'
              keyTimes='0; 1'
              type='translate'/>
      <animateTransform
              attributeName='transform'
              begin='StateChange(normal, low)'
              dur='200ms'
              fill='freeze'
              from='1 0'
              to='2 0'
              keyTimes='0; 1'
              type='translate'/>
      <animateTransform
