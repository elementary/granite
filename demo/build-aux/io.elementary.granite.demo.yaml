id: io.elementary.granite.demo
runtime: io.elementary.Platform
runtime-version: daily
sdk: io.elementary.Sdk
command: granite-9-demo
tags:
  - devel
desktop-file-name-suffix: ' (Development)'
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/aclocal
  - /man
  - /share/man
  - /share/gtk-doc
  - /share/vala
  - '*.la'
  - '*.a'
  - '*.pyc'
  - '*.pyo'
modules:
  - name: libsass
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/lazka/libsass.git
        branch: meson
        commit: aac79dccd3c8f7e8f22125f87a119f3b1ee9d487
  - name: sassc
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/lazka/sassc.git
        branch: meson
        commit: a1950c2d95ea4c051feb90bb1f43559fbb54bf36
  - name: protobuf-c
    buildsystem: autotools
    config-opts:
      - --disable-protoc
    sources:
      - type: git
        url: https://github.com/protobuf-c/protobuf-c.git
        tag: v1.5.2
        commit: 4719fdd7760624388c2c5b9d6759eb6a47490626
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
  - name: libshumate
    buildsystem: meson
    config-opts:
      - -Dgtk_doc=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libshumate.git
        tag: 1.7.0
        commit: e345c805a0dfc46cdbff46cac287b0b60a386f36
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
  - name: demo
    config-opts:
      - --libdir=lib
    buildsystem: meson
    sources:
      - type: dir
        path: ../..
